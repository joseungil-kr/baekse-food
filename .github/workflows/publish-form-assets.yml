name: Baekse publish verified screenshots and printable PDFs
on:
  push:
    branches: [feat/free-form-blog-footer-20261110]
    paths: ['.github/workflows/publish-form-assets.yml']
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/free-form-blog-footer-20261110
          persist-credentials: true
      - name: Reuse verified genuine screenshots and A4 PDF assets
        uses: actions/download-artifact@v4
        with:
          name: baekse-three-free-forms-screens-and-pdfs
          run-id: 42760494637
          github-token: ${{ github.token }}
          path: .
      - name: Check images and PDF sizes
        run: |
          python3 -m pip install --quiet --user pillow pypdf
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          from pypdf import PdfReader
          for name in ['invoice-landscape','invoice-vertical','receipt']:
            image=Path('static/img/print-forms')/(name+'.webp')
            pdf=Path('static/downloads/print-forms')/(name+'.pdf')
            with Image.open(image) as pic:
              assert pic.width>500 and pic.height>450,(name,pic.size)
            doc=PdfReader(str(pdf))
            assert len(doc.pages)==1,(name,'physical pages',len(doc.pages))
            w=float(doc.pages[0].mediabox.width);h=float(doc.pages[0].mediabox.height)
            assert 590<min(w,h)<600 and 835<max(w,h)<850,(name,w,h)
            assert (w<h)==(name!='invoice-landscape'),(name,'orientation',w,h)
            assert image.stat().st_size>5000 and pdf.stat().st_size>10000
            print('REAL_CAPTURE_AND_A4_PDF_VERIFIED',name,image.stat().st_size,pdf.stat().st_size)
          PY
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.152.2'
          extended: true
      - name: Validate full Hugo build, blog pages, images and PDF hyperlinks
        run: |
          hugo --minify --destination /tmp/baekse-blog-qa
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/baekse-blog-qa')
          main=(root/'index.html').read_text()
          blog=(root/'blog/index.html').read_text()
          assert '한국어' in main and 'EN' in main,'Multilingual header failed'
          assert '<language>ko</language>' in (root/'index.xml').read_text(),'RSS language output failed'
          for route in ['manual-invoice','manual-invoice-vertical','simple-receipt']:
            assert 'https://order.baeksefood.com/'+route+'/' in main,'Missing footer link '+route
          for file,post in [('invoice-landscape','free-invoice-landscape'),('invoice-vertical','free-invoice-vertical'),('receipt','free-simple-receipt')]:
            html=(root/'blog'/post/'index.html').read_text()
            assert '빈 양식 PDF 다운로드' in html,'No PDF CTA '+post
            assert '/downloads/print-forms/'+file+'.pdf' in html,'No PDF link '+post
            assert '/img/print-forms/'+file+'.webp' in html,'No image '+post
            assert '/blog/'+post+'/' in blog,'Not listed '+post
            assert (root/'img/print-forms'/(file+'.webp')).stat().st_size>5000
            assert (root/'downloads/print-forms'/(file+'.pdf')).stat().st_size>10000
          print('BAEKSE_HUGO_BUILD_THREE_BLOG_POSTS_PDF_IMAGES_PASS')
          PY
      - name: Safely hand verified public binary data to connected GitHub content tools
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib
          for slug in ['invoice-landscape','invoice-vertical','receipt']:
            for path in [Path('static/img/print-forms')/(slug+'.webp'),Path('static/downloads/print-forms')/(slug+'.pdf')]:
              data=path.read_bytes()
              blob=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              b64=base64.b64encode(data).decode('ascii')
              chunks=[b64[i:i+2048] for i in range(0,len(b64),2048)]
              print('ASSET_BEGIN|'+str(path)+'|'+str(len(data))+'|'+blob+'|'+str(len(chunks)),flush=True)
              for i,part in enumerate(chunks):
                print('ASSET_CHUNK|'+str(path)+'|'+str(i)+'|'+part,flush=True)
              print('ASSET_END|'+str(path),flush=True)
          print('VERIFIED_PUBLIC_ASSET_TRANSFER_READY',flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baekse-form-assets-verified
          path: |
            static/img/print-forms/
            static/downloads/print-forms/
          retention-days: 7
          if-no-files-found: ignore
