name: Baekse public free-forms HTTP verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-free-forms.yml'
      - 'layouts/**'
      - 'content/blog/free-*.md'
      - 'static/img/print-forms/**'
      - 'static/downloads/print-forms/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read deployed pages and PDFs directly from the public custom domain
        run: |
          python3 -m pip install --quiet --user pypdf
          python3 - <<'PY'
          import io,time,urllib.request,urllib.error
          from pypdf import PdfReader
          ROOT='https://baeksefood.com'
          def fetch(path):
            url=ROOT+path
            last=None
            for attempt in range(12):
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'Baekse-Forms-Public-HTTP-QA/1.0','Cache-Control':'no-cache'})
                with urllib.request.urlopen(req,timeout=20) as response:
                  content=response.read()
                  assert response.status==200,(url,response.status)
                  return content,response.headers
              except (urllib.error.URLError,TimeoutError,AssertionError) as err:
                last=err
                time.sleep(8)
            raise RuntimeError('LIVE_HTTP_UNAVAILABLE '+url+' '+str(last))
          homepage,_=fetch('/')
          blog,_=fetch('/blog/')
          for slug,route,post,portrait in [
            ('invoice-landscape','manual-invoice','free-invoice-landscape',False),
            ('invoice-vertical','manual-invoice-vertical','free-invoice-vertical',True),
            ('receipt','simple-receipt','free-simple-receipt',True),
          ]:
            assert ('https://order.baeksefood.com/'+route+'/').encode() in homepage,'Missing footer '+route
            assert ('/blog/'+post+'/').encode() in blog,'Missing blog card '+post
            detail,_=fetch('/blog/'+post+'/')
            assert ('/img/print-forms/'+slug+'.webp').encode() in detail
            assert ('/downloads/print-forms/'+slug+'.pdf').encode() in detail
            assert ('https://order.baeksefood.com/'+route+'/').encode() in detail
            img,ih=fetch('/img/print-forms/'+slug+'.webp')
            assert img[:4]==b'RIFF' and img[8:12]==b'WEBP' and len(img)>5000,(slug,'invalid screenshot')
            pdf,ph=fetch('/downloads/print-forms/'+slug+'.pdf')
            assert pdf.startswith(b'%PDF-') and len(pdf)>10000,(slug,'invalid PDF')
            doc=PdfReader(io.BytesIO(pdf))
            assert len(doc.pages)==1,(slug,'PDF pages',len(doc.pages))
            w=float(doc.pages[0].mediabox.width);h=float(doc.pages[0].mediabox.height)
            assert 590<min(w,h)<600 and 835<max(w,h)<850,(slug,w,h)
            assert (w<h)==portrait,(slug,'wrong A4 orientation',w,h)
            print('LIVE_BAEKSE_FORM_PAGE_IMAGE_AND_PDF_PASS',slug,len(img),len(pdf),flush=True)
          print('LIVE_BAEKSE_HOMEPAGE_BLOG_FOOTER_THREE_FORMS_PASS',flush=True)
          PY
