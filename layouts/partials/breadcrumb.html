{{ if ne .RelPermalink "/" }}
<nav class="breadcrumb"><a href="{{ "/" | absURL }}">홈</a> / {{ .Title }}</nav>
<script type="application/ld+json">
{{ (dict "@context" "https://schema.org" "@type" "BreadcrumbList" "itemListElement" (slice
  (dict "@type" "ListItem" "position" 1 "name" "홈" "item" (absURL "/"))
  (dict "@type" "ListItem" "position" 2 "name" .Title "item" .Permalink)
)) | jsonify }}
</script>
{{ end }}
